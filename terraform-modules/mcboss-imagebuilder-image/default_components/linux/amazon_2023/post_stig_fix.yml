name: 'Post-STIG-SSM-Fix'
description: 'Temporarily remounts /tmp with exec to allow AWS Image Builder to finish its internal steps.'
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: RemountTmpForSSM
        action: ExecuteBash
        inputs:
          commands:
            - echo "Temporarily allowing execution in /tmp for SSM InventoryCollection..."
            - mount -o remount,exec /tmp || true
            - mount -o remount,exec /var/tmp || true
