name: 'Force-Failure'
description: 'Intentionally fails the pipeline so the instance is not terminated.'
schemaVersion: 1.0
phases:
  - name: build
    steps:
      - name: FailNow
        action: ExecuteBash
        inputs:
          commands:
            - echo "Sabotaging the pipeline to keep the EC2 instance alive for debugging!"
            - exit 1